project:
  name: "game-aigc-asset-workflow"
  task_group: "game_asset_generation"
  stage: "bootstrap"
  description: "Base configuration for game-oriented AIGC asset generation workflow."

paths:
  data_root: "data"
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  metadata_dir: "data/metadata"

  prompts_root: "prompts"
  workflows_root: "workflows/comfyui"
  configs_root: "configs"

  outputs_root: "outputs"
  results_root: "results"
  logs_root: "logs"

  examples_input_dir: "examples/inputs"
  examples_output_dir: "examples/outputs"

  ue5_validation_dir: "ue5_validation"
  ue5_screenshots_dir: "ue5_validation/screenshots"

runtime:
  seed: 42
  device: "cuda"
  dtype: "fp16"
  mixed_precision: true

task:
  type: "baseline_generation"
  asset_type: "generic"
  scenario: "game_art"
  target_engine: "UE5"

model:
  family: "stable-diffusion"
  base_model_name: "to_be_filled"
  variant: "base"
  use_lora: false
  lora_path: ""
  use_controlnet: false
  controlnet_model_name: ""
  use_ip_adapter: false
  ip_adapter_path: ""

generation:
  prompt_file: ""
  negative_prompt_file: ""
  width: 1024
  height: 1024
  num_images: 4
  batch_size: 1
  num_inference_steps: 30
  guidance_scale: 7.0
  sampler: "to_be_filled"
  scheduler: "to_be_filled"
  clip_skip: 0

preprocess:
  enabled: false
  mode: "none"
  keep_original: true
  resize:
    enabled: true
    width: 1024
    height: 1024
    keep_aspect_ratio: true
    pad_to_target: true
  edge:
    enabled: false
    method: "canny"
    threshold1: 100
    threshold2: 200
  mask:
    enabled: false
    source: "manual_or_placeholder"

data:
  dataset_name: "placeholder_dataset"
  metadata_file: ""
  caption_source: "manual"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  shuffle: true

evaluation:
  enabled: true
  dimensions:
    - "style_consistency"
    - "readability"
    - "structure_control"
    - "asset_reusability"
  save_report: true
  report_format: "md"

logging:
  level: "INFO"
  save_to_file: true
  log_file: "logs/project.log"

notes:
  status: "bootstrap"
  owner: "to_be_filled"
  remarks: "This is the shared base config. Task-specific configs should override selected fields."