project:
  name: "game-aigc-asset-workflow"
  task_group: "game_asset_generation"
  stage: "bootstrap"
  description: "Base configuration for game-oriented AIGC asset generation workflow."

paths:
  data_root: "data"
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  metadata_dir: "data/metadata"

  prompts_root: "prompts"
  workflows_root: "workflows/comfyui"
  configs_root: "configs"
  comfyui_models_root: "ComfyUI/models"
  comfyui_checkpoints_dir: "ComfyUI/models/checkpoints"
  comfyui_vae_dir: "ComfyUI/models/vae"
  comfyui_loras_dir: "ComfyUI/models/loras"
  comfyui_controlnet_dir: "ComfyUI/models/controlnet"

  outputs_root: "outputs"
  results_root: "results"
  logs_root: "logs"

  examples_input_dir: "examples/inputs"
  examples_output_dir: "examples/outputs"

  ue5_validation_dir: "ue5_validation"
  ue5_screenshots_dir: "ue5_validation/screenshots"

runtime:
  seed: 42
  device: "cuda"
  dtype: "fp16"
  mixed_precision: true

task:
  type: "baseline_generation"
  asset_type: "generic"
  scenario: "game_art"
  target_engine: "UE5"

model:
  family: "stable-diffusion"
  base_model_name: "to_be_filled"
  variant: "base"
  # Legacy toggle fields are kept for backward compatibility.
  use_lora: false
  lora_path: ""
  lora_strength: 1.0
  use_controlnet: false
  controlnet_model_name: ""
  controlnet_strength: 0.8
  use_ip_adapter: false
  ip_adapter_path: ""

generation:
  prompt_file: ""
  negative_prompt_file: ""
  width: 1024
  height: 1024
  num_images: 4
  batch_size: 1
  num_inference_steps: 30
  guidance_scale: 7.0
  sampler: "to_be_filled"
  scheduler: "to_be_filled"
  clip_skip: 0

comfyui:
  enabled: false
  comfyui_root: "ComfyUI"
  base_url: "http://127.0.0.1:8188"
  mode: "manifest"
  mapping_mode: "manual_map" # manual_map | auto_detect
  workflow_json: "workflows/comfyui/sdxl_ui_icon_base.json"
  node_map: "configs/comfyui_ui_icon_node_map.yaml"
  save_patched_workflows_dir: "results/patched_workflows"
  workflow_import:
    enabled: true
    use_detected_family: false
    prefer_workflow_requirements: true
  workflow_model_family: "classic_checkpoint"
  workflow_model_requirements:
    required:
      - "checkpoints"
    recommended:
      - "vae"
    optional:
      - "embeddings"
      - "loras"
      - "controlnet"
  strict_model_dir_check: false
  model_resolution_policy:
    case_insensitive: true
    allow_stem_match: true
    allow_fuzzy_match: true
    fuzzy_cutoff: 0.6
    aliases: {}
    path_overrides: {}
  report_output_dirs:
    workflow_inspection: "results/workflow_inspection"
    model_resolution: "results/model_resolution"
    mapping_suggestions: "results/mapping_suggestions"
    patch_reports: "results/patch_reports"
  # Baseline recommendation: patch SaveImage.filename_prefix only.
  patch_save_image_output_dir: false
  save_image_output_dir: ""

comfyui_models:
  root: "ComfyUI/models"
  mainline_required:
    checkpoints: "ComfyUI/models/checkpoints"
    diffusion_models: "ComfyUI/models/diffusion_models"
    vae: "ComfyUI/models/vae"
    text_encoders: "ComfyUI/models/text_encoders"
  common_extensions:
    clip_vision: "ComfyUI/models/clip_vision"
    loras: "ComfyUI/models/loras"
    controlnet: "ComfyUI/models/controlnet"
    embeddings: "ComfyUI/models/embeddings"
    style_models: "ComfyUI/models/style_models"
    upscale_models: "ComfyUI/models/upscale_models"
    latent_upscale_models: "ComfyUI/models/latent_upscale_models"
    photomaker: "ComfyUI/models/photomaker"
    gligen: "ComfyUI/models/gligen"
    hypernetworks: "ComfyUI/models/hypernetworks"
    audio_encoders: "ComfyUI/models/audio_encoders"
  advanced_optional:
    diffusers: "ComfyUI/models/diffusers"
    vae_approx: "ComfyUI/models/vae_approx"
    classifiers: "ComfyUI/models/classifiers"
    model_patches: "ComfyUI/models/model_patches"
    download_model_base: "ComfyUI/models/download_model_base"

lora:
  enabled: false
  path: ""
  strength: 1.0

controlnet:
  enabled: false
  model_name: ""
  control_image_path: ""
  strength: 0.8

preprocess:
  enabled: false
  mode: "none"
  keep_original: true
  resize:
    enabled: true
    width: 1024
    height: 1024
    keep_aspect_ratio: true
    pad_to_target: true
  edge:
    enabled: false
    method: "canny"
    threshold1: 100
    threshold2: 200
  mask:
    enabled: false
    source: "manual_or_placeholder"

data:
  dataset_name: "placeholder_dataset"
  metadata_file: ""
  caption_source: "manual"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  shuffle: true

evaluation:
  enabled: true
  dimensions:
    - "style_consistency"
    - "readability"
    - "structure_control"
    - "asset_reusability"
  save_report: true
  report_format: "md"

logging:
  level: "INFO"
  save_to_file: true
  log_file: "logs/project.log"

notes:
  status: "bootstrap"
  owner: "to_be_filled"
  remarks: "This is the shared base config. Task-specific configs should override selected fields."
