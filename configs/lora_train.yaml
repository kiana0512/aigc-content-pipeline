project:
  name: "game-aigc-asset-workflow"
  task_group: "game_asset_generation"
  stage: "lora_experiment"
  description: "Configuration skeleton for small-scale LoRA fine-tuning experiments on game visual styles."

paths:
  data_root: "data"
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  metadata_dir: "data/metadata"

  prompts_root: "prompts"
  workflows_root: "workflows/comfyui"
  configs_root: "configs"
  comfyui_models_root: "ComfyUI/models"
  comfyui_checkpoints_dir: "ComfyUI/models/checkpoints"
  comfyui_vae_dir: "ComfyUI/models/vae"
  comfyui_loras_dir: "ComfyUI/models/loras"
  comfyui_controlnet_dir: "ComfyUI/models/controlnet"

  outputs_root: "outputs"
  results_root: "results"
  logs_root: "logs"

  train_data_dir: "data/processed/lora_train"
  val_data_dir: "data/processed/lora_val"
  checkpoint_dir: "checkpoints/lora"
  preview_dir: "outputs/lora_previews"

runtime:
  seed: 42
  device: "cuda"
  dtype: "fp16"
  mixed_precision: true

task:
  type: "lora_finetuning"
  asset_type: "style_adaptation"
  scenario: "game_visual_style"
  target_engine: "UE5"

model:
  family: "stable-diffusion-xl"
  base_model_name: "stabilityai/stable-diffusion-xl-base-1.0"
  variant: "sdxl_base"
  tokenizer_name: "openai/clip-vit-large-patch14"
  vae_name: "madebyollin/sdxl-vae-fp16-fix"

lora:
  enabled: true
  path: ""
  strength: 1.0
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules:
    - "to_q"
    - "to_k"
    - "to_v"
    - "to_out.0"

controlnet:
  enabled: false
  model_name: ""
  control_image_path: ""
  strength: 0.8

comfyui:
  enabled: false
  base_url: "http://127.0.0.1:8188"
  mode: "manifest"
  workflow_json: "workflows/comfyui/sdxl_ui_icon_base.json"
  node_map: "configs/comfyui_ui_icon_node_map.yaml"
  save_patched_workflows_dir: "results/patched_workflows/lora_validation"
  workflow_model_family: "classic_checkpoint"
  workflow_model_requirements:
    required:
      - "checkpoints"
    recommended:
      - "vae"
    optional:
      - "embeddings"
      - "loras"
  strict_model_dir_check: false
  patch_save_image_output_dir: false
  save_image_output_dir: ""

comfyui_models:
  root: "ComfyUI/models"
  mainline_required:
    checkpoints: "ComfyUI/models/checkpoints"
    diffusion_models: "ComfyUI/models/diffusion_models"
    vae: "ComfyUI/models/vae"
    text_encoders: "ComfyUI/models/text_encoders"
  common_extensions:
    clip_vision: "ComfyUI/models/clip_vision"
    loras: "ComfyUI/models/loras"
    controlnet: "ComfyUI/models/controlnet"
    embeddings: "ComfyUI/models/embeddings"
    style_models: "ComfyUI/models/style_models"
    upscale_models: "ComfyUI/models/upscale_models"
    latent_upscale_models: "ComfyUI/models/latent_upscale_models"
    photomaker: "ComfyUI/models/photomaker"
    gligen: "ComfyUI/models/gligen"
    hypernetworks: "ComfyUI/models/hypernetworks"
    audio_encoders: "ComfyUI/models/audio_encoders"
  advanced_optional:
    diffusers: "ComfyUI/models/diffusers"
    vae_approx: "ComfyUI/models/vae_approx"
    classifiers: "ComfyUI/models/classifiers"
    model_patches: "ComfyUI/models/model_patches"
    download_model_base: "ComfyUI/models/download_model_base"

training:
  train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  lr_scheduler: "constant"
  lr_warmup_steps: 0
  max_train_steps: 2000
  num_train_epochs: 10
  checkpointing_steps: 500
  save_total_limit: 3
  validation_steps: 250
  gradient_checkpointing: true
  use_8bit_adam: false
  dataloader_num_workers: 4

data:
  dataset_name: "game_style_lora_placeholder"
  metadata_file: "data/metadata/lora_train_metadata.csv"
  image_column: "image_path"
  caption_column: "caption"
  caption_source: "manual_or_cleaned"
  resolution: 1024
  center_crop: false
  random_flip: false
  shuffle: true

validation:
  enabled: true
  prompt_file: "prompts/templates/style_template.txt"
  negative_prompt_file: "prompts/ui_icons/negative.txt"
  num_validation_images: 4
  validation_guidance_scale: 7.0
  validation_inference_steps: 30

evaluation:
  enabled: true
  dimensions:
    - "style_similarity"
    - "overfitting_risk"
    - "generation_stability"
    - "downstream_usability"
  save_report: true
  report_format: "md"
  report_file: "results/lora/lora_train_report.md"

logging:
  level: "INFO"
  save_to_file: true
  log_file: "logs/lora_train.log"

notes:
  status: "placeholder_ready"
  owner: "to_be_filled"
  remarks: "Small-scale LoRA training config for style adaptation experiments. Parameters should be refined after dataset preparation and baseline workflow validation."
