project:
  name: "game-aigc-asset-workflow"
  task_group: "game_asset_generation"
  stage: "real_api_workflow_smoke"
  description: "Qwen image illustration LoRA real ComfyUI API workflow smoke config."

task:
  type: "baseline_generation"
  asset_type: "character_concept"
  scenario: "qwen_image_illustration_lora_smoke"
  target_engine: "UE5"

runtime:
  seed: 20260424
  device: "cuda"
  dtype: "fp16"
  mixed_precision: true

generation:
  prompt: "game character illustration, young warrior, clean cel shading, bold composition, high quality"
  negative_prompt: "low quality, blurry, bad anatomy, watermark"
  width: 1024
  height: 1024
  batch_size: 1
  num_images: 2
  num_inference_steps: 28
  guidance_scale: 5.5
  sampler: "euler"
  scheduler: "karras"
  denoise: 1.0
  filename_prefix: "qwen_image_lora"
  output_subdir: "outputs/qwen_image_lora"

model:
  family: "split-model"
  base_model_name: "qwen-image"
  variant: "illustration_lora_api_workflow"
  use_lora: true
  lora_path: "illustration-1.0-qwen-image.safetensors"
  lora_strength: 1.0
  use_controlnet: false
  controlnet_model_name: ""
  controlnet_strength: 0.8

comfyui:
  enabled: true
  comfyui_root: "ComfyUI"
  base_url: "http://127.0.0.1:8000"
  run_name: "qwen_image_illustration_lora_api"
  mode: "workflow_import_pipeline"
  mapping_mode: "manual_map"
  workflow_json: "workflows/comfyui/qwen_image_illustration_lora_api.json"
  node_map: "configs/node_maps/qwen_image_illustration_lora_node_map.yaml"
  save_patched_workflows_dir: "results/patched_workflows/qwen_image_lora"
  workflow_import:
    enabled: true
    use_detected_family: true
    prefer_workflow_requirements: true
  workflow_model_family: "split_model"
  workflow_model_requirements:
    required:
      - "diffusion_models"
      - "text_encoders"
      - "vae"
    recommended:
      - "unet"
      - "clip"
    optional:
      - "loras"
      - "controlnet"
  strict_model_dir_check: false
  model_resolution_policy:
    case_insensitive: true
    allow_stem_match: true
    allow_fuzzy_match: true
    fuzzy_cutoff: 0.6
    aliases: {}
    path_overrides: {}
  report_output_dirs:
    workflow_inspection: "results/workflow_inspection"
    model_resolution: "results/model_resolution"
    mapping_suggestions: "results/mapping_suggestions"
    patch_reports: "results/patch_reports"
  patch_save_image_output_dir: false
  save_image_output_dir: ""

comfyui_models:
  root: "ComfyUI/models"
  mainline_required:
    checkpoints: "ComfyUI/models/checkpoints"
    diffusion_models: "ComfyUI/models/diffusion_models"
    unet: "ComfyUI/models/unet"
    vae: "ComfyUI/models/vae"
    text_encoders: "ComfyUI/models/text_encoders"
    clip: "ComfyUI/models/clip"
  common_extensions:
    clip_vision: "ComfyUI/models/clip_vision"
    loras: "ComfyUI/models/loras"
    controlnet: "ComfyUI/models/controlnet"
    embeddings: "ComfyUI/models/embeddings"
    style_models: "ComfyUI/models/style_models"
    upscale_models: "ComfyUI/models/upscale_models"
    latent_upscale_models: "ComfyUI/models/latent_upscale_models"
    photomaker: "ComfyUI/models/photomaker"
    gligen: "ComfyUI/models/gligen"
    hypernetworks: "ComfyUI/models/hypernetworks"
    audio_encoders: "ComfyUI/models/audio_encoders"
  advanced_optional:
    diffusers: "ComfyUI/models/diffusers"
    vae_approx: "ComfyUI/models/vae_approx"
    classifiers: "ComfyUI/models/classifiers"
    model_patches: "ComfyUI/models/model_patches"
    download_model_base: "ComfyUI/models/download_model_base"

lora:
  enabled: true
  path: "illustration-1.0-qwen-image.safetensors"
  strength: 1.0

controlnet:
  enabled: false
  model_name: ""
  control_image_path: ""
  strength: 0.8
