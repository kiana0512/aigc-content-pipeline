project:
  name: "game-aigc-asset-workflow"
  task_group: "workflow_first_import"
  stage: "workflow_import"
  description: "最小 workflow-first 导入示例。"

runtime:
  seed: 42
  device: "cuda"
  dtype: "fp16"
  mixed_precision: true

generation:
  width: 1024
  height: 1024
  num_images: 1
  batch_size: 1
  num_inference_steps: 30
  guidance_scale: 7.0
  sampler: "euler_a"
  scheduler: "karras"
  output_subdir: "outputs/workflow_import_example"

comfyui:
  enabled: true
  comfyui_root: "ComfyUI"
  mode: "workflow_import_pipeline"
  mapping_mode: "auto_detect"
  workflow_json: "workflows/comfyui/replace_with_real_api_workflow.json"
  node_map: ""
  save_patched_workflows_dir: "results/patched_workflows/workflow_import_example"
  workflow_import:
    enabled: true
    use_detected_family: true
    prefer_workflow_requirements: true
  workflow_model_family: "classic_checkpoint" # 可手工覆盖
  workflow_model_requirements:
    required: []
    recommended: []
    optional: []
  strict_model_dir_check: false
  model_resolution_policy:
    case_insensitive: true
    allow_stem_match: true
    allow_fuzzy_match: true
    fuzzy_cutoff: 0.6
    aliases: {}
    path_overrides: {}
  report_output_dirs:
    workflow_inspection: "results/workflow_inspection"
    model_resolution: "results/model_resolution"
    mapping_suggestions: "results/mapping_suggestions"
    patch_reports: "results/patch_reports"
  patch_save_image_output_dir: false
  save_image_output_dir: ""

comfyui_models:
  root: "ComfyUI/models"
  mainline_required:
    checkpoints: "ComfyUI/models/checkpoints"
    diffusion_models: "ComfyUI/models/diffusion_models"
    vae: "ComfyUI/models/vae"
    text_encoders: "ComfyUI/models/text_encoders"
  common_extensions:
    clip_vision: "ComfyUI/models/clip_vision"
    loras: "ComfyUI/models/loras"
    controlnet: "ComfyUI/models/controlnet"
    embeddings: "ComfyUI/models/embeddings"
    style_models: "ComfyUI/models/style_models"
    upscale_models: "ComfyUI/models/upscale_models"
    latent_upscale_models: "ComfyUI/models/latent_upscale_models"
    photomaker: "ComfyUI/models/photomaker"
    gligen: "ComfyUI/models/gligen"
    hypernetworks: "ComfyUI/models/hypernetworks"
    audio_encoders: "ComfyUI/models/audio_encoders"
  advanced_optional:
    diffusers: "ComfyUI/models/diffusers"
    vae_approx: "ComfyUI/models/vae_approx"
    classifiers: "ComfyUI/models/classifiers"
    model_patches: "ComfyUI/models/model_patches"
    download_model_base: "ComfyUI/models/download_model_base"
