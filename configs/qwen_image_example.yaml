project:
  name: "game-aigc-asset-workflow"
  task_group: "game_asset_generation"
  stage: "qwen_split_model_baseline"
  description: "Qwen split-model workflow-first 示例配置。"

task:
  type: "baseline_generation"
  asset_type: "character_concept"
  scenario: "split_model_baseline"
  target_engine: "UE5"

runtime:
  seed: 20260422
  device: "cuda"
  dtype: "fp16"
  mixed_precision: true

generation:
  prompt_file: "prompts/character_concepts/positive.txt"
  negative_prompt_file: "prompts/character_concepts/negative.txt"
  width: 1024
  height: 1024
  num_images: 4
  batch_size: 1
  num_inference_steps: 28
  guidance_scale: 5.5
  sampler: "euler"
  scheduler: "karras"
  output_subdir: "outputs/qwen_split_baseline"

model:
  family: "split-model"
  base_model_name: "qwen-image-example"
  variant: "api_workflow_driven"
  use_lora: false
  use_controlnet: false

comfyui:
  enabled: true
  comfyui_root: "ComfyUI"
  base_url: "http://127.0.0.1:8188"
  mode: "workflow_import_pipeline"
  mapping_mode: "auto_detect"
  workflow_json: "workflows/comfyui/qwen_image_api_example.json"
  node_map: "configs/comfyui_concept_node_map.yaml" # 可选手工覆盖
  save_patched_workflows_dir: "results/patched_workflows/qwen_split_baseline"
  workflow_import:
    enabled: true
    use_detected_family: true
    prefer_workflow_requirements: true
  workflow_model_family: "split_model" # 可手工覆盖，默认可由 workflow 推断
  workflow_model_requirements:
    required:
      - "diffusion_models"
      - "text_encoders"
      - "vae"
    recommended: []
    optional:
      - "loras"
      - "controlnet"
      - "clip_vision"
  strict_model_dir_check: false
  model_resolution_policy:
    case_insensitive: true
    allow_stem_match: true
    allow_fuzzy_match: true
    fuzzy_cutoff: 0.6
    aliases:
      "qwen_image_unet_fp8.safetensors": "qwen_unet_fp8.safetensors"
    path_overrides: {}
  report_output_dirs:
    workflow_inspection: "results/workflow_inspection"
    model_resolution: "results/model_resolution"
    mapping_suggestions: "results/mapping_suggestions"
    patch_reports: "results/patch_reports"
  patch_save_image_output_dir: false
  save_image_output_dir: ""

comfyui_models:
  root: "ComfyUI/models"
  mainline_required:
    checkpoints: "ComfyUI/models/checkpoints"
    diffusion_models: "ComfyUI/models/diffusion_models"
    vae: "ComfyUI/models/vae"
    text_encoders: "ComfyUI/models/text_encoders"
  common_extensions:
    clip_vision: "ComfyUI/models/clip_vision"
    loras: "ComfyUI/models/loras"
    controlnet: "ComfyUI/models/controlnet"
    embeddings: "ComfyUI/models/embeddings"
    style_models: "ComfyUI/models/style_models"
    upscale_models: "ComfyUI/models/upscale_models"
    latent_upscale_models: "ComfyUI/models/latent_upscale_models"
    photomaker: "ComfyUI/models/photomaker"
    gligen: "ComfyUI/models/gligen"
    hypernetworks: "ComfyUI/models/hypernetworks"
    audio_encoders: "ComfyUI/models/audio_encoders"
  advanced_optional:
    diffusers: "ComfyUI/models/diffusers"
    vae_approx: "ComfyUI/models/vae_approx"
    classifiers: "ComfyUI/models/classifiers"
    model_patches: "ComfyUI/models/model_patches"
    download_model_base: "ComfyUI/models/download_model_base"
