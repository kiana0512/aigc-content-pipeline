meta:
  name: "character_concept_baseline_node_map"
  workflow_format: "comfyui_api_prompt"
  notes: >
    Example node mapping for SDXL character concept baseline.
    Update node ids to match your real ComfyUI-exported API workflow.
    Baseline recommendation: patch SaveImage.filename_prefix only.

required:
  positive_prompt:
    node_id: "16"
    input_key: "text"
  negative_prompt:
    node_id: "17"
    input_key: "text"
  latent_size:
    node_id: "15"
    width_key: "width"
    height_key: "height"
  sampler:
    node_id: "13"
    seed_key: "seed"
    steps_key: "steps"
    cfg_key: "cfg"
    sampler_key: "sampler_name"
    scheduler_key: "scheduler"

optional:
  save_image:
    node_id: "19"
    filename_prefix_key: "filename_prefix"
    # Optional advanced case only. Keep empty in baseline.
    output_dir_key: ""
  lora:
    node_id: ""
    enabled_key: ""
    path_key: "lora_name"
    strength_key: "strength_model"
  controlnet:
    enabled_node_id: ""
    enabled_key: ""
    model_node_id: ""
    model_key: "control_net_name"
    strength_node_id: ""
    strength_key: "strength"
    image_node_id: ""
    image_key: "image"
