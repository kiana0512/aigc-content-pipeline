project:
  name: "game-aigc-asset-workflow"
  task_group: "game_asset_generation"
  stage: "baseline_concept"
  description: "Task-specific config for SDXL-based character concept and stylized concept art generation."

paths:
  data_root: "data"
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  metadata_dir: "data/metadata"

  prompts_root: "prompts"
  workflows_root: "workflows/comfyui"
  configs_root: "configs"
  comfyui_models_root: "ComfyUI/models"
  comfyui_checkpoints_dir: "ComfyUI/models/checkpoints"
  comfyui_vae_dir: "ComfyUI/models/vae"
  comfyui_loras_dir: "ComfyUI/models/loras"
  comfyui_controlnet_dir: "ComfyUI/models/controlnet"

  outputs_root: "outputs"
  results_root: "results"
  logs_root: "logs"

  examples_input_dir: "examples/inputs"
  examples_output_dir: "examples/outputs"

  ue5_validation_dir: "ue5_validation"
  ue5_screenshots_dir: "ue5_validation/screenshots"

runtime:
  seed: 42
  device: "cuda"
  dtype: "fp16"
  mixed_precision: true

task:
  type: "baseline_generation"
  asset_type: "character_concept"
  scenario: "game_concept_art"
  target_engine: "UE5"

model:
  family: "stable-diffusion-xl"
  base_model_name: "stabilityai/stable-diffusion-xl-base-1.0"
  variant: "sdxl_base"
  use_lora: false
  lora_path: ""
  lora_strength: 1.0
  use_controlnet: false
  controlnet_model_name: ""
  controlnet_strength: 0.8
  use_ip_adapter: false
  ip_adapter_path: ""

generation:
  prompt_file: "prompts/character_concepts/positive.txt"
  negative_prompt_file: "prompts/character_concepts/negative.txt"
  width: 1024
  height: 1024
  num_images: 6
  batch_size: 1
  num_inference_steps: 35
  guidance_scale: 7.5
  sampler: "dpmpp_2m"
  scheduler: "karras"
  clip_skip: 0
  output_subdir: "outputs/character_concepts/baseline"

comfyui:
  enabled: true
  comfyui_root: "ComfyUI"
  base_url: "http://127.0.0.1:8188"
  mode: "patch_workflow"
  mapping_mode: "manual_map"
  workflow_json: "workflows/comfyui/sdxl_concept_base.json"
  node_map: "configs/comfyui_concept_node_map.yaml"
  save_patched_workflows_dir: "results/patched_workflows/character_concepts"
  workflow_import:
    enabled: true
    use_detected_family: false
    prefer_workflow_requirements: true
  workflow_model_family: "classic_checkpoint"
  workflow_model_requirements:
    required:
      - "checkpoints"
    recommended:
      - "vae"
    optional:
      - "embeddings"
      - "loras"
      - "controlnet"
      - "style_models"
  strict_model_dir_check: false
  model_resolution_policy:
    case_insensitive: true
    allow_stem_match: true
    allow_fuzzy_match: true
    fuzzy_cutoff: 0.6
    aliases: {}
    path_overrides: {}
  report_output_dirs:
    workflow_inspection: "results/workflow_inspection"
    model_resolution: "results/model_resolution"
    mapping_suggestions: "results/mapping_suggestions"
    patch_reports: "results/patch_reports"
  patch_save_image_output_dir: false
  save_image_output_dir: ""

comfyui_models:
  root: "ComfyUI/models"
  mainline_required:
    checkpoints: "ComfyUI/models/checkpoints"
    diffusion_models: "ComfyUI/models/diffusion_models"
    vae: "ComfyUI/models/vae"
    text_encoders: "ComfyUI/models/text_encoders"
  common_extensions:
    clip_vision: "ComfyUI/models/clip_vision"
    loras: "ComfyUI/models/loras"
    controlnet: "ComfyUI/models/controlnet"
    embeddings: "ComfyUI/models/embeddings"
    style_models: "ComfyUI/models/style_models"
    upscale_models: "ComfyUI/models/upscale_models"
    latent_upscale_models: "ComfyUI/models/latent_upscale_models"
    photomaker: "ComfyUI/models/photomaker"
    gligen: "ComfyUI/models/gligen"
    hypernetworks: "ComfyUI/models/hypernetworks"
    audio_encoders: "ComfyUI/models/audio_encoders"
  advanced_optional:
    diffusers: "ComfyUI/models/diffusers"
    vae_approx: "ComfyUI/models/vae_approx"
    classifiers: "ComfyUI/models/classifiers"
    model_patches: "ComfyUI/models/model_patches"
    download_model_base: "ComfyUI/models/download_model_base"

lora:
  enabled: false
  path: ""
  strength: 1.0

controlnet:
  enabled: false
  model_name: ""
  control_image_path: ""
  strength: 0.8

preprocess:
  enabled: false
  mode: "none"
  keep_original: true
  resize:
    enabled: true
    width: 1024
    height: 1024
    keep_aspect_ratio: true
    pad_to_target: true
  edge:
    enabled: false
    method: "canny"
    threshold1: 100
    threshold2: 200
  mask:
    enabled: false
    source: "manual_or_placeholder"

data:
  dataset_name: "game_character_concept_placeholder"
  metadata_file: "data/metadata/character_concept_metadata.csv"
  caption_source: "manual"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  shuffle: true

evaluation:
  enabled: true
  dimensions:
    - "style_consistency"
    - "character_readability"
    - "composition_quality"
    - "downstream_concept_usability"
  save_report: true
  report_format: "md"
  report_file: "results/character_concepts/concept_baseline_report.md"

logging:
  level: "INFO"
  save_to_file: true
  log_file: "logs/sdxl_concept.log"

notes:
  status: "baseline_ready"
  owner: "to_be_filled"
  remarks: "Baseline SDXL config for character concept and stylized concept art generation. Suitable for later extension with reference-guided generation or LoRA style adaptation."



